server {
    listen 80;
    listen [::]:80;
    server_name kb.example.com;
    access_log /var/log/nginx/knowledge-base.access.log combined;
    error_log /var/log/nginx/knowledge-base.error.log warn;
    location ^~ /.well-known/acme-challenge/ { root /srv/knowledge-base/acme; }
    location / { return 301 https://kb.example.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name kb.example.com;
    root /srv/knowledge-base/current/public;
    index index.php;
    charset utf-8;
    ssl_certificate /etc/letsencrypt/live/kb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kb.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 210m;
    access_log /var/log/nginx/knowledge-base.access.log combined;
    error_log /var/log/nginx/knowledge-base.error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ^~ /build/ { expires 1y; try_files $uri =404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/knowledge-base/php-fpm.sock;
        fastcgi_read_timeout 180s;
        fastcgi_buffering off;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
