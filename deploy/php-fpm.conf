[knowledge-base]
user = knowledge-base
group = knowledge-base
listen = /run/knowledge-base/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 15s
pm.max_requests = 300
chdir = /srv/knowledge-base/current
clear_env = yes
catch_workers_output = yes
request_terminate_timeout = 180s
php_admin_value[memory_limit] = 192M
php_admin_value[upload_max_filesize] = 200M
php_admin_value[post_max_size] = 210M
php_admin_value[max_execution_time] = 150
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /srv/knowledge-base/shared/storage/logs/php.log
php_admin_value[opcache.validate_timestamps] = 1
php_admin_value[opcache.revalidate_freq] = 2
